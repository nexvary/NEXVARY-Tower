name: Tower Guard signed APK

on:
  workflow_dispatch:
  push:
    branches: [feature/tower-guard-production-release, release/tower-guard-signed]

permissions:
  contents: read

concurrency:
  group: tower-guard-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Verify Release lint and regression tests
        run: ./gradlew --no-daemon :app:lintRelease :app:testReleaseUnitTest
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: github.ref == 'refs/heads/feature/tower-guard-production-release'
      - name: Build isolated QA APKs with a disposable CI key
        if: github.ref == 'refs/heads/feature/tower-guard-production-release'
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/tower-qa-key.XXXXXX")"
          trap 'rm -rf -- "$keydir"' EXIT
          export TOWER_KEYSTORE_PATH="$keydir/qa.p12"
          export TOWER_KEY_ALIAS=ci-emulator-only
          export TOWER_STORE_PASSWORD="$(openssl rand -hex 24)"
          export TOWER_KEY_PASSWORD="$TOWER_STORE_PASSWORD"
          keytool -genkeypair -storetype PKCS12 -keystore "$TOWER_KEYSTORE_PATH" \
            -alias "$TOWER_KEY_ALIAS" -dname 'CN=Tower Guard Disposable Emulator QA' \
            -keyalg RSA -keysize 2048 -validity 1 -storepass:env TOWER_STORE_PASSWORD
          bash scripts/build-release-pair.sh "$RUNNER_TEMP/tower-apks"
          cd "$RUNNER_TEMP/tower-apks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --Werr NEXVARY-Tower-Guard.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging NEXVARY-Tower-Guard.apk > release-badging.txt
          version=$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" release-badging.txt)
          [[ "$version" =~ ^[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum NEXVARY-Tower-Guard.apk > NEXVARY-Tower-Guard.apk.sha256
      - name: Enable emulator acceleration
        if: steps.preflight.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        if: steps.preflight.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ steps.preflight.outputs.version }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/verify-release-upgrade.sh "$RUNNER_TEMP/tower-apks"

  sign:
    if: github.ref == 'refs/heads/release/tower-guard-signed'
    needs: quality
    runs-on: ubuntu-24.04
    environment: tower-guard-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and sign release and upgrade baseline
        shell: bash
        env:
          TOWER_KEYSTORE_BASE64: ${{ secrets.TOWER_KEYSTORE_BASE64 }}
          TOWER_STORE_PASSWORD: ${{ secrets.TOWER_STORE_PASSWORD }}
          TOWER_KEY_ALIAS: ${{ secrets.TOWER_KEY_ALIAS }}
          TOWER_KEY_PASSWORD: ${{ secrets.TOWER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TOWER_KEYSTORE_BASE64:?Missing keystore secret}"
          : "${TOWER_STORE_PASSWORD:?Missing store password secret}"
          : "${TOWER_KEY_ALIAS:?Missing alias secret}"
          : "${TOWER_KEY_PASSWORD:?Missing key password secret}"
          umask 077
          TOWER_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/tower-keystore.XXXXXX")"
          export TOWER_KEYSTORE_PATH
          trap 'rm -f -- "$TOWER_KEYSTORE_PATH"' EXIT
          printf '%s' "$TOWER_KEYSTORE_BASE64" | base64 --decode > "$TOWER_KEYSTORE_PATH"
          unset TOWER_KEYSTORE_BASE64
          bash scripts/build-release-pair.sh "$RUNNER_TEMP/tower-apks"
      - name: Verify package, version codes and signing identity
        id: verify
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.TOWER_RELEASE_CERT_SHA256 }}
          LAST_DISTRIBUTED_VERSION: ${{ vars.TOWER_LAST_RELEASE_VERSION_CODE }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$LAST_DISTRIBUTED_VERSION" =~ ^(0|[1-9][0-9]{0,9})$ ]]
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cd "$RUNNER_TEMP/tower-apks"
          for apk in baseline.apk NEXVARY-Tower-Guard.apk; do
            "$tools/apksigner" verify --verbose --print-certs --Werr "$apk" > "$apk.signature.txt"
            grep -Fx 'Number of signers: 1' "$apk.signature.txt"
            grep -Fxi "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT" "$apk.signature.txt"
            [[ "$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" == com.nexvary.imsi ]]
          done
          "$tools/aapt" dump badging NEXVARY-Tower-Guard.apk > release-badging.txt
          grep -Fx "application-label:'NEXVARY Tower Guard'" release-badging.txt
          grep -Fx "application-label-ar:'NEXVARY Tower Guard'" release-badging.txt
          baseline=$("$tools/aapt" dump badging baseline.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          version=$("$tools/aapt" dump badging NEXVARY-Tower-Guard.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          [[ "$baseline" =~ ^[0-9]+$ && "$version" =~ ^[0-9]+$ ]]
          (( version == baseline + 1 && version > LAST_DISTRIBUTED_VERSION ))
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum NEXVARY-Tower-Guard.apk > NEXVARY-Tower-Guard.apk.sha256
          sha256sum --check NEXVARY-Tower-Guard.apk.sha256
          stat --format='%s' NEXVARY-Tower-Guard.apk > NEXVARY-Tower-Guard.apk.size-bytes.txt
          "$tools/aapt" dump permissions NEXVARY-Tower-Guard.apk > release-permissions.txt
          if grep -Fq "android.permission.INTERNET" release-permissions.txt; then
            echo 'Unexpected INTERNET permission in release APK' >&2
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/verify-release-upgrade.sh "$RUNNER_TEMP/tower-apks"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Tower-Guard-release-vc${{ steps.verify.outputs.version }}
          path: |
            ${{ runner.temp }}/tower-apks/NEXVARY-Tower-Guard.apk
            ${{ runner.temp }}/tower-apks/NEXVARY-Tower-Guard.apk.sha256
            ${{ runner.temp }}/tower-apks/NEXVARY-Tower-Guard.apk.signature.txt
            ${{ runner.temp }}/tower-apks/NEXVARY-Tower-Guard.apk.size-bytes.txt
            ${{ runner.temp }}/tower-apks/release-badging.txt
            ${{ runner.temp }}/tower-apks/release-permissions.txt
            ${{ runner.temp }}/tower-apks/before.txt
            ${{ runner.temp }}/tower-apks/after.txt
            ${{ runner.temp }}/tower-apks/installation-verification.txt
          if-no-files-found: error
